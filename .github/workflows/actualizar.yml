name: Actualizador Semanal de Afiliados

on:
  schedule:
    - cron: '0 8 * * 1' # Se ejecuta automáticamente todos los lunes a las 8:00 AM
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Ejecutar script de actualización
        run: python actualizar_productos.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name 'Bot Actualizador'
          git config --global user.email 'bot@miportal.com'
          git add productos.json
          git commit -m "Actualización semanal de catálogo" || echo "Sin cambios"
          git push
